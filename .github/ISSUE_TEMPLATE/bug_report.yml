name: 🐛 Informar de un error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por dedicar tiempo a informar del error! Rellena todos los datos que puedas. Los registros del puerto serie son lo más útil.
  - type: dropdown
    id: build
    attributes:
      label: Compilación
      options:
        - WebServer_Code
        - Basic_Code
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Placa
      placeholder: p. ej., ESP32-S3 DevKitC-1, Arduino Nano o NodeMCU ESP8266
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interfaz K-Line
      options:
        - Basada en transistores
        - Comparador (LM393)
        - L9637D
        - MC33290
        - Si9241
        - SN65HVDA195
        - Otra / placa personalizada
    validations:
      required: true
  - type: input
    id: vehicle
    attributes:
      label: Vehículo
      placeholder: Marca, modelo, año y motor (p. ej., Opel Astra H 2006 1.6 Z16XEP)
  - type: dropdown
    id: protocol
    attributes:
      label: Protocolo seleccionado
      options:
        - Automático
        - ISO 9141-2
        - ISO 14230 KWP2000 (inicialización lenta)
        - ISO 14230 KWP2000 (inicialización rápida)
  - type: textarea
    id: description
    attributes:
      label: ¿Qué ha ocurrido?
      description: ¿Qué esperabas que ocurriera y qué ha ocurrido en su lugar?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Salida de depuración del puerto serie
      description: Activa `DEBUG_Serial` y pega el registro (bytes enviados y recibidos). Si lo prefieres, elimina tu VIN.
      render: text
