name: 🚗 Informe de compatibilidad del vehículo
description: Indica si OBD2 K-Line Reader funciona en tu coche
title: "[Vehículo] <marca> <modelo> <año>"
labels: ["vehicle-report"]
body:
  - type: markdown
    attributes:
      value: |
        Los informes de pruebas reales ayudan a comprobar qué coches son compatibles. ¡Gracias! 🙌
  - type: input
    id: vehicle
    attributes:
      label: Vehículo
      placeholder: Marca, modelo y año (p. ej., Toyota Corolla 2004)
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Motor / ECU
      placeholder: p. ej., 1.4 VVT-i gasolina, Bosch ME7.9.10
  - type: dropdown
    id: result
    attributes:
      label: Resultado
      options:
        - ✅ Funciona
        - ⚠️ Funciona parcialmente
        - ❌ No conecta
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocolo detectado
      options:
        - ISO 9141-2
        - ISO 14230 KWP2000 (inicialización lenta)
        - ISO 14230 KWP2000 (inicialización rápida)
        - No detectado
    validations:
      required: true
  - type: checkboxes
    id: features
    attributes:
      label: Funciones que funcionan
      options:
        - label: Datos en directo
        - label: Leer códigos de avería (DTC)
        - label: Borrar códigos de avería (DTC)
        - label: Cuadro congelado
        - label: VIN / información del vehículo
  - type: input
    id: hardware
    attributes:
      label: Placa e interfaz
      placeholder: p. ej., ESP32-S3 + L9637D
  - type: textarea
    id: notes
    attributes:
      label: Notas
      description: Cualquier otro dato útil (particularidades, ajustes de temporización o registros).
