name: 💡 Proponer una función
description: Sugiere una idea o mejora
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué problema resolvería?
      placeholder: Me resulta frustrante que ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solución propuesta
      description: Describe qué te gustaría que ocurriera.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: contribute
    attributes:
      label: Colaboración
      options:
        - label: Me gustaría ayudar a implementarla
